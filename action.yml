name: "Monotrack CLI"
description: "Runs Monotrack CLI"
author: ArnoldVanN

inputs:
  command:
    description: "The command to run. Defaults to 'tag bump'"
    default: "tag bump"
  base:
    description: "The base SHA used to compare"
    required: false
  head:
    description: "The HEAD SHA used to compare"
    required: false
  args:
    description: "Arguments to pass to the command"
    required: false
  config:
    description: "Name of the configuration file"
    required: false
  version:
    description: "CLI version (release tag, e.g. `v0.8.2`). When unset, defaults to the latest release matching the action's major (e.g. `v0` when called as `@v0` or `@v0.8.3`). When pinned to a commit SHA, uses the release tag on that commit. Set explicitly when pinning to a branch or an untagged commit."
    default: ""
    required: false
  token:
    description: "Token used for GitHub API calls, such as opening or updating the release PR. Defaults to `github.token`. Pass a GitHub App or PAT token so workflows run on the release PR without maintainer approval."
    default: ${{ github.token }}
    required: false
outputs:
  output:
    value: ${{ steps.run.outputs.output }}
    description: "The CLI output"

branding:
  icon: book-open
  color: gray-dark

runs:
  using: "composite"
  steps:
    - name: Run Monotrack CLI
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        BASE="$INPUT_BASE"
        HEAD="$INPUT_HEAD"

        if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
          case "$GITHUB_EVENT_NAME" in
            push)
              BASE="${BASE:-$(jq -r '.before // empty' < "$GITHUB_EVENT_PATH")}"
              HEAD="${HEAD:-$(jq -r '.after // empty' < "$GITHUB_EVENT_PATH")}"
              ;;
            pull_request|pull_request_target)
              BASE="${BASE:-$(jq -r '.pull_request.base.sha' < "$GITHUB_EVENT_PATH")}"
              HEAD="${HEAD:-$(jq -r '.pull_request.head.sha' < "$GITHUB_EVENT_PATH")}"
              ;;
            workflow_dispatch|schedule)
              # User must provide explicitly
              ;;
          esac
        fi

        HEAD="${HEAD:-$GITHUB_SHA}"

        echo "Resolved BASE: $BASE"
        echo "Resolved HEAD: $HEAD"

        if [ -z "$BASE" ]; then
          echo "::warning::Unable to determine base SHA."
        fi

        read -r -a CLI_ARGS <<< "$INPUT_COMMAND $INPUT_ARGS"

        VERSION="$INPUT_VERSION"
        if [ -z "$VERSION" ]; then
          # GITHUB_ACTION_REF is unreliable for composite actions — fall back to parsing
          # the trailing ref segment from GITHUB_ACTION_PATH (e.g. /…/_actions/owner/repo/<ref>).
          REF="${GITHUB_ACTION_REF:-}"
          if [ -z "$REF" ] && [ -n "${GITHUB_ACTION_PATH:-}" ]; then
            REF="$(basename "$GITHUB_ACTION_PATH")"
          fi
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$REF"
          elif [[ "$REF" =~ ^v([0-9]+)(\.[0-9]+)?$ ]]; then
            # Major (or major.minor) — resolve to the latest matching release tag.
            MAJOR="${BASH_REMATCH[1]}"
            VERSION="$(curl -fsSL \
              ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/arnoldvann/monotrack/releases?per_page=100" \
              | jq -r "[.[] | select(.draft==false) | select(.prerelease==false) | .tag_name | select(startswith(\"v${MAJOR}.\"))] | .[0] // empty")"
            if [ -z "$VERSION" ]; then
              echo "::error::Could not find a published monotrack release matching v${MAJOR}.* on GitHub."
              exit 1
            fi
          elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            # Pinned to a commit, e.g. by Renovate — use the release tag on that commit.
            VERSION="$(git ls-remote --tags https://github.com/arnoldvann/monotrack.git \
              | awk -v sha="$REF" '$1 == sha { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            if [ -z "$VERSION" ]; then
              echo "::error::No monotrack release tag points at commit $REF. Pin the action to a release commit, or set the \`version\` input explicitly."
              exit 1
            fi
          else
            echo "::error::Could not derive a default monotrack version from ref \"$REF\". Pin the action to a tag like @v0 or @v0.7.3, or set the \`version\` input explicitly."
            exit 1
          fi
        fi

        # Map runner OS/arch to goreleaser archive names (monotrack_<Os>_<Arch>.<ext>).
        case "$RUNNER_OS" in
          Linux)   OS="Linux"; EXT="tar.gz" ;;
          macOS)   OS="Darwin"; EXT="tar.gz" ;;
          Windows) OS="Windows"; EXT="zip" ;;
          *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   ARCH="x86_64" ;;
          ARM64) ARCH="arm64" ;;
          *) echo "::error::Unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac

        ASSET="monotrack_${OS}_${ARCH}.${EXT}"
        INSTALL_DIR="$RUNNER_TEMP/monotrack-${VERSION}"
        BIN="$INSTALL_DIR/monotrack"
        [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"

        if [ ! -x "$BIN" ]; then
          echo "Downloading $ASSET from release $VERSION"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL -o "$INSTALL_DIR/$ASSET" \
            "https://github.com/arnoldvann/monotrack/releases/download/$VERSION/$ASSET"
          if [ "$EXT" = "zip" ]; then
            unzip -q "$INSTALL_DIR/$ASSET" -d "$INSTALL_DIR"
          else
            tar -xzf "$INSTALL_DIR/$ASSET" -C "$INSTALL_DIR"
          fi
          chmod +x "$BIN"
        fi

        echo "CLI Arguments: ${CLI_ARGS[*]}"
        echo "Using Monotrack version: $VERSION"
        echo "Using config file: $INPUT_CONFIG"

        # Mirror the docker entrypoint: trust the workspace and set a default git identity
        # so monotrack can create commits/tags. Use --add so we don't clobber prior config.
        git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
        if [ -z "$(git config --global user.name || true)" ]; then
          git config --global user.name "github-actions[bot]"
        fi
        if [ -z "$(git config --global user.email || true)" ]; then
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
        fi

        set +e
        OUTPUT=$(cd "$GITHUB_WORKSPACE" && "$BIN" \
            "${CLI_ARGS[@]}" \
            --base "$BASE" \
            --head "$HEAD" \
            --config "$INPUT_CONFIG")
        EXIT_CODE=$?
        set -e

        if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Monotrack command failed with exit code $EXIT_CODE"
            echo "$OUTPUT"
            exit "$EXIT_CODE"
        fi

        echo "Monotrack result: "
        echo "$OUTPUT"

        DELIM="EOF_$(openssl rand -hex 16)"
        {
          echo "output<<$DELIM"
          echo "$OUTPUT"
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"
