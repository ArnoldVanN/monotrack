name: "Monotrack CLI"
description: "Runs Monotrack CLI"
author: ArnoldVanN

inputs:
  command:
    description: "The command to run. Defaults to 'tag bump'"
    default: "tag bump"
  base:
    description: "The base SHA used to compare"
    required: false
  head:
    description: "The HEAD SHA used to compare"
    required: false
  args:
    description: "Arguments to pass to the command"
    required: false
  config:
    description: "Name of the configuration file"
    required: false
  version:
    description: "CLI version (docker tag). When unset, defaults to the latest patch of the action's major (e.g. `v0` when called as `@v0` or `@v0.7.3`). Errors if the action ref isn't semver-shaped — set explicitly when pinning to a branch or SHA."
    default: ""
    required: false
outputs:
  output:
    value: ${{ steps.run.outputs.output }}
    description: "The CLI output"

branding:
  icon: book-open
  color: gray-dark

runs:
  using: "composite"
  steps:
    - name: Run Monotrack CLI
      id: run
      shell: bash
      run: |
        set -euo pipefail

        BASE=${{ inputs.base }}
        HEAD=${{ inputs.head }}

        if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
          case "$GITHUB_EVENT_NAME" in
            push)
              BASE="${BASE:-$(jq -r '.before // empty' < "$GITHUB_EVENT_PATH")}"
              HEAD="${HEAD:-$(jq -r '.after // empty' < "$GITHUB_EVENT_PATH")}"
              ;;
            pull_request|pull_request_target)
              BASE="${BASE:-$(jq -r '.pull_request.base.sha' < "$GITHUB_EVENT_PATH")}"
              HEAD="${HEAD:-$(jq -r '.pull_request.head.sha' < "$GITHUB_EVENT_PATH")}"
              ;;
            workflow_dispatch|schedule)
              # User must provide explicitly
              ;;
          esac
        fi

        HEAD="${HEAD:-$GITHUB_SHA}"

        echo "Resolved BASE: $BASE"
        echo "Resolved HEAD: $HEAD"

        if [ -z "$BASE" ]; then
          echo "::warning::Unable to determine base SHA."
        fi

        read -r -a CLI_ARGS <<< "${{ inputs.command }} ${{ inputs.args }}"

        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          # Resolve to the moving v<major> docker tag based on how the action was invoked.
          # GITHUB_ACTION_REF is the ref the caller used (e.g. v0.7.3, v0, main, or a SHA).
          REF="${GITHUB_ACTION_REF:-}"
          if [[ "$REF" =~ ^v([0-9]+)(\.[0-9]+)?(\.[0-9]+)?$ ]]; then
            VERSION="v${BASH_REMATCH[1]}"
          else
            echo "::error::Could not derive a default monotrack version from GITHUB_ACTION_REF=\"$REF\". Pin the action to a tag like @v0 or @v0.7.3, or set the \`version\` input explicitly."
            exit 1
          fi
        fi

        echo "CLI Arguments: ${CLI_ARGS[*]}"
        echo "Using Monotrack version: $VERSION"
        echo "Using config file: ${{ inputs.config }}"

        set +e
        OUTPUT=$(docker run --rm \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN:-}" \
            -e GH_TOKEN="${GITHUB_TOKEN:-}" \
            -v "$GITHUB_WORKSPACE":/repo \
            -w /repo \
            ghcr.io/arnoldvann/monotrack:$VERSION \
            "${CLI_ARGS[@]}" \
            --base "$BASE" \
            --head "$HEAD" \
            --config "${{ inputs.config }}")
        EXIT_CODE=$?
        set -e

        if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Monotrack command failed with exit code $EXIT_CODE"
            echo "$OUTPUT"
            exit "$EXIT_CODE"
        fi

        echo "Monotrack result: "
        echo "$OUTPUT"

        echo "output<<EOF" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
