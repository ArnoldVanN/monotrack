name: publish

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to publish, e.g. v1.2.3"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, e.g. v1.2.3"
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, v)) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arnoldvann/monotrack
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/arnoldvann/monotrack:cache
          cache-to: type=registry,ref=ghcr.io/arnoldvann/monotrack:cache,mode=max
