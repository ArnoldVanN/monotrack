name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - 'CHANGELOG.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
