name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  monotrack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build monotrack
        run: go build -o "$RUNNER_TEMP/monotrack" .

      - name: Tag bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output=$("$RUNNER_TEMP/monotrack" tag bump -o json)
          echo "$output"
          version=$(jq -r '[.[] | select(.status == "released")][0].version // empty' <<< "${output:-[]}")
          pr=$(jq -r '[.[] | select(.status == "proposed")][0].prUrl // empty' <<< "${output:-[]}")
          [ -n "$version" ] && echo "::notice::Released $version"
          [ -n "$pr" ] && echo "::notice::Release PR: $pr"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: monotrack
    if: needs.monotrack.outputs.version != ''
    uses: ./.github/workflows/publish.yaml
    with:
      version: ${{ needs.monotrack.outputs.version }}
    secrets: inherit

  floating-tags:
    needs: [monotrack, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.monotrack.outputs.version }}

      - name: Move major and minor tags
        env:
          VERSION: ${{ needs.monotrack.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          git tag -f "$major" "$VERSION^{}"
          git tag -f "$minor" "$VERSION^{}"
          git push -f origin "refs/tags/$major" "refs/tags/$minor"
